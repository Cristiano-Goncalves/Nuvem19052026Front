<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>CRUD Produtos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>📦 Sistema de Gestão de Produtos</h1>

  <button id="theme-toggle">
    🌙 Modo Escuro
  </button>
</header>

<section id="menu-principal">

  <h2>Menu Principal</h2>

  <button onclick="mostrarTela('add-section')">
    1. Adicionar Produto
  </button>

  <button onclick="abrirAtualizacao()">
    2. Atualizar Produto
  </button>

  <button onclick="mostrarTela('search-section')">
    3. Pesquisar Produto por ID
  </button>

  <button onclick="abrirListagem()">
    4. Listar Produtos
  </button>

  <button onclick="abrirExclusao()">
    5. Excluir Produto
  </button>

</section>

<section id="add-section" class="tela">

  <h2>Adicionar Produto</h2>

  <form id="add-product-form">

    <label>Nome:</label>
    <input type="text" id="name" required>

    <label>Preço:</label>
    <input type="number" id="price" required>

    <label>Descrição:</label>
    <textarea id="description"></textarea>

    <button type="submit">
      Salvar
    </button>

  </form>

  <button onclick="voltarMenu()">
    Voltar ao Menu Principal
  </button>

</section>

<section id="update-section" class="tela">

  <h2>Atualizar Produto</h2>

  <h3>Produtos Cadastrados</h3>

  <ul id="update-products-list"></ul>

  <form id="update-product-form">

    <label>ID</label>
    <input type="text" id="update-id" readonly>

    <label>Nome</label>
    <input type="text" id="update-name">

    <label>Preço</label>
    <input type="number" id="update-price">

    <label>Descrição</label>
    <textarea id="update-description"></textarea>

    <button type="submit">
      Atualizar
    </button>

  </form>

  <button onclick="voltarMenu()">
    Voltar ao Menu Principal
  </button>

</section>

<section id="search-section" class="tela">

  <h2>Pesquisar Produto</h2>

  <input
    type="number"
    id="search-id"
    placeholder="Informe o ID">

  <button id="btn-search">
    Buscar
  </button>

  <div id="search-result"></div>

  <button onclick="voltarMenu()">
    Voltar ao Menu Principal
  </button>

</section>

<section id="list-section" class="tela">

  <h2>Produtos Cadastrados</h2>

  <ul id="products"></ul>

  <button onclick="voltarMenu()">
    Voltar ao Menu Principal
  </button>

</section>

<section id="delete-section" class="tela">

  <h2>Excluir Produto</h2>

  <h3>Produtos Ativos</h3>

  <ul id="delete-products-list"></ul>

  <div id="delete-result"></div>

  <button onclick="voltarMenu()">
    Voltar ao Menu Principal
  </button>

</section>

<script src="app.js?v=1.4"></script>

</body>
</html>
